<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>回應結果總覽</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#15181e; --sub:#5d6573; --muted:#8a93a2; --line:#dfe3ea;
    --bar:#3b6fd8; --track:#eef1f6; --top:#1f4fb8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#171a21; --ink:#eef1f6; --sub:#a9b1bf; --muted:#7c8594; --line:#2a2f3a;
      --bar:#6f9cf0; --track:#232833; --top:#9dbcf7; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:13px;margin:0 0 18px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .controls label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
  select,input[type=date],button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  button{cursor:pointer;font-weight:700}
  button:hover{border-color:var(--bar)}
  .status{font-size:12px;color:var(--muted);margin-left:auto}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .tile .k{font-size:12px;color:var(--sub)}
  .tile .v{font-size:26px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
  .tile .v small{font-size:13px;color:var(--sub);font-weight:600}
  .ep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .epHead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
  .epTag{font-size:11.5px;font-weight:800;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .epTitle{font-size:16px;font-weight:800}
  .epCount{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);font-size:13px;margin-top:6px}
  .block{margin-top:12px}
  .blockTitle{font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:6px}
  .q{font-size:13px;font-weight:700;margin:8px 0 6px}
  .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;margin-bottom:7px;font-size:13px}
  .row .lab{overflow-wrap:anywhere}
  .row .num{font-size:12.5px;color:var(--sub);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .track{grid-column:1 / -1;height:8px;background:var(--track);border-radius:999px;overflow:hidden}
  .fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0}
  .row.top .lab{font-weight:800}
  details{margin-top:10px}
  summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--sub)}
  .texts{margin:8px 0 0;padding:0;list-style:none}
  .texts li{font-size:13.5px;padding:8px 10px;border-left:3px solid var(--line);margin-bottom:6px;background:var(--track);border-radius:0 8px 8px 0}
  .texts time{display:block;font-size:11.5px;color:var(--muted)}
  .note{font-size:12px;color:var(--muted);margin-top:24px}
  input[type=password]{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:9em}
  .adminOn{font-size:12px;font-weight:800;color:#15803d}
  table.names{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  table.names th,table.names td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  table.names th{font-size:12px;color:var(--sub)}
  .pass{color:#15803d;font-weight:800}
  .gate{max-width:360px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center}
  .gate h1{margin-bottom:6px}
  .gate p{color:var(--sub);font-size:13.5px;margin:0 0 16px}
  .gate input[type=password]{width:100%;font-size:16px;padding:10px 12px;margin-bottom:10px}
  .gate button{width:100%;font-size:15px;padding:10px;background:var(--ink);color:var(--card);border-color:var(--ink)}
  .gateMsg{color:#b91c1c;font-size:13px;font-weight:700;min-height:1.4em;margin-top:8px}
  .gate .back{display:inline-block;margin-top:12px;font-size:13px;color:var(--sub)}
  body.hideNames .nameList{display:none}
  .hint{font-size:12.5px;color:var(--sub);margin:6px 0 4px}
  table.open td{vertical-align:middle}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:5px 10px;font-size:12.5px;background:var(--card)}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--ink);color:var(--card)}
  .st-open{color:#15803d;font-weight:800}
  .st-closed{color:var(--sub);font-weight:700}
  table.hist td{vertical-align:top}
  table.hist summary{cursor:pointer;font-weight:800;color:var(--ink);font-size:13px}
  ul.sess{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--sub)}
  ul.sess li{margin-bottom:4px}
  .fail{color:#b91c1c;font-weight:800}
  .topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
  .topbar h1{margin:0}
  #adminBox{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
  #adminBox label{display:flex;align-items:center;gap:4px}
  .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .tab{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);
    color:var(--ink);text-decoration:none;min-width:0}
  .tab:hover{border-color:var(--bar)}
  .tab b{font-size:15px;line-height:1.3}
  .tab small{font-size:12px;color:var(--sub);font-weight:600}
  .tab.cur{border-color:var(--ink);background:var(--ink);color:var(--card)}
  .tab.cur small{color:var(--track)}
  .units{display:flex;flex-direction:column;gap:8px}
  .unit{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:6px 12px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;color:inherit;text-decoration:none}
  .unit:hover{border-color:var(--bar)}
  .unit .ut b{display:block;font-size:14.5px;line-height:1.35}
  .unit .ut small{font-size:12px;color:var(--sub)}
  .unit .more{font-size:12.5px;font-weight:800;color:var(--bar);white-space:nowrap}
  .unit.dim .ut b{color:var(--sub)}
  .chip{font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .chip.open{background:#dcfce7;color:#15803d}
  .chip.closed{background:var(--track);color:var(--sub)}
  .chip.manual::after{content:"・手動";font-weight:600}
  .back{display:inline-block;margin:2px 0 10px;font-size:13.5px;font-weight:800;color:var(--bar);text-decoration:none}
  .detailHead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:4px}
  .detailHead .epTitle{font-size:18px}
  .sectionTitle{font-size:13px;font-weight:800;color:var(--sub);margin:16px 0 8px}
  @media (max-width:720px){
    .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
    .unit{grid-template-columns:auto minmax(0,1fr) auto}
    .unit .seg{grid-column:2 / -1;justify-self:start}
    .unit .more{display:none}
  }
  @media (max-width:480px){ .status{margin-left:0;width:100%} .epCount{margin-left:0;width:100%} }
</style>
</head>
<body>
<!-- 後台管理：從首頁「🔒 後台管理」進來，先輸入管理密碼（Worker 的 ADMIN_KEY）才看得到資料 -->
<form class="gate" id="gate" hidden onsubmit="return false">
  <h1>🔒 後台管理</h1>
  <p>回應結果總覽（含具名名單），請輸入管理密碼</p>
  <input type="password" id="gateKey" autocomplete="current-password" placeholder="管理密碼">
  <button type="submit" id="gateGo">登入</button>
  <div class="gateMsg" id="gateMsg"></div>
  <a class="back" href="../index.html">← 回首頁</a>
</form>

<div class="wrap" id="main" hidden>
  <div class="topbar">
    <h1>🔒 後台管理</h1>
    <span id="adminBox"></span>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="controls">
    <label>從這天起算 <input type="date" id="since"></label>
    <button type="button" id="reload">重新整理</button>
    <button type="button" id="csv">下載全部回應 CSV</button>
    <span class="status" id="status">載入中…</span>
  </div>
  <div id="view"></div>
  <p class="note">點單元可以看回饋與成果；「從這天起算」可以排除開放前的測試作答。情境卡同一支手機每張只算一次；「最有感的一點」和打字回應每送出一次算一筆。CSV 用 Excel 開啟即可（UTF-8）。<br>
    名字只在這個後台看得到；要投影統計給大家看時，勾「隱藏名字（投影用）」。登入只記在這個分頁，關掉分頁或按「登出」就要重新輸入密碼。</p>
</div>

<script>
// 由 產生網頁.py --cloud 填入；本機版留空，這一頁只在雲端版有資料
const API_BASE = "";
const SITE_KEY = "";
// 每一集的標籤、標題、選項文字（產生網頁.py 從腳本整理），用來把資料庫裡的 A/B/C 對回選項
const EPISODES = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LETTERS = "ABCDE";
let allRows = [];
let adminMode = false; // 用管理密碼讀到含名字的資料
const EXAM_Q = "結訓測驗";
const isScn = (r) => /^(第\d+章)?情境\d+$/.test(r.question || "");
const adminKey = () => { try { return sessionStorage.getItem("admin-key") || ""; } catch(e){ return ""; } };
function setAdminKey(v){ try { v ? sessionStorage.setItem("admin-key", v) : sessionStorage.removeItem("admin-key"); } catch(e){} }
const timeStr = (t) => new Date(t).toLocaleString("zh-TW");
// 每個名字只留最後一次（資料已經是新到舊）
// ==== 同一人判斷（結訓名單、學習歷程共用）====
// ① 名字一樣（社編不同）② 社編一樣（名字打錯）③ 少打姓：一個名字是另一個去掉開頭的字（至少 2 字）
// （不在程式裡寫死真名對照：這個網站的原始碼是公開的）
const namePart = (n) => n.replace(/\d+$/, "");
const idPart = (n) => (n.match(/\d+$/) || [""])[0];
function sameName(a, b){
  const na = namePart(a), nb = namePart(b), ia = idPart(a), ib = idPart(b);
  if(na === nb || (ia && ia === ib)) return true;
  const [s1, l1] = na.length <= nb.length ? [na, nb] : [nb, na];
  return s1.length >= 2 && l1.length > s1.length && l1.endsWith(s1);
}
// 把一堆名字分成「同一人」的組：回傳 名字 → 代表名字（該組裡紀錄最多的那個寫法）
function personMap(rows){
  const cnt = {};
  rows.forEach(r => { cnt[r.name] = (cnt[r.name] || 0) + 1; });
  const names = Object.keys(cnt), parent = names.map((x, k) => k);
  const root = (k) => parent[k] === k ? k : (parent[k] = root(parent[k]));
  names.forEach((a, k) => names.forEach((b, j) => { if(j > k && sameName(a, b)) parent[root(j)] = root(k); }));
  const best = {};
  names.forEach((n, k) => { const g = root(k); if(!(g in best) || cnt[n] > cnt[best[g]]) best[g] = n; });
  return Object.fromEntries(names.map((n, k) => [n, best[root(k)]]));
}

// ==== 學習歷程：每人完成哪些集數／單元＋線上學習時數 ====
// 時數：同一人的作答依時間排序，間隔超過 30 分鐘就切成新的一段；每段取「第一筆到最後一筆的時間差」
// 與「這段碰到的集數／單元，內容用 1.5 倍速播完的長度」較大者（現場看投影、只用手機作答的人才不會算太少）
const SESSION_GAP_MIN = 30;
function unitOf(r){
  const ep = EPISODES.find(e => e.label === r.episode);
  if(!ep) return null;
  if(ep.chapterMins){
    if(r.question === EXAM_Q) return {key: ep.label + "|exam", title: `${ep.tag} 結訓測驗`, mins: ep.examMins || 0};
    const m = (r.question || "").match(/^第(\d+)章/);
    return m ? {key: ep.label + "|ch" + m[1], title: `${ep.tag} 第 ${m[1]} 章`, mins: ep.chapterMins[m[1] - 1] || 0} : null;
  }
  return {key: ep.label, title: `${ep.tag} ${ep.title}`, mins: ep.mins || 0};
}
function fmtMins(m){ m = Math.round(m); return m >= 60 ? `${Math.floor(m / 60)} 小時 ${m % 60} 分` : `${m} 分`; }
let historyData = [];
function buildHistory(rows){
  const named = rows.filter(r => r.name);
  const pmap = personMap(named);
  const by = {};
  named.forEach(r => (by[pmap[r.name]] = by[pmap[r.name]] || []).push(r));
  const eps52 = EPISODES.filter(e => e.series === "52"), epsAi = EPISODES.filter(e => e.series === "ai");
  const course = EPISODES.find(e => e.chapterMins);
  return Object.entries(by).map(([person, rs]) => {
    const has = (label, q) => rs.some(r => r.episode === label && (!q || r.question === q));
    const epDone = (e) => e.scenarios.length ? e.scenarios.every((sc, k) => has(e.label, sc.q || `情境${k+1}`)) : has(e.label);
    const done52 = eps52.filter(epDone), doneAi = epsAi.filter(epDone);
    let usb = null;
    if(course){
      const chapQs = {};
      course.scenarios.forEach(sc => { const m = (sc.q || "").match(/^第(\d+)章/); if(m) (chapQs[m[1]] = chapQs[m[1]] || []).push(sc.q); });
      const nums = Object.keys(chapQs).sort((a, b) => a - b);
      const doneCh = nums.filter(n => chapQs[n].every(q => has(course.label, q)));
      const exam = rs.filter(r => r.episode === course.label && r.question === EXAM_Q).sort((a, b) => b.submitted_at.localeCompare(a.submitted_at))[0];
      usb = {done: doneCh.length, total: nums.length, exam, pass: doneCh.length === nums.length && !!exam && /・通過/.test(exam.choice || "")};
    }
    // 學習時數
    const sorted = rs.slice().sort((a, b) => a.submitted_at.localeCompare(b.submitted_at));
    const sessions = [];
    sorted.forEach(r => {
      const t = new Date(r.submitted_at).getTime(), cur = sessions[sessions.length - 1];
      if(cur && t - cur.end <= SESSION_GAP_MIN * 60000){ cur.end = t; cur.rows.push(r); }
      else sessions.push({start: t, end: t, rows: [r]});
    });
    const credited = new Set();
    let total = 0;
    sessions.forEach(ss => {
      ss.span = (ss.end - ss.start) / 60000;
      ss.units = [];
      ss.rows.forEach(r => { const u = unitOf(r); if(u && !ss.units.some(x => x.key === u.key)) ss.units.push(u); });
      ss.floor = ss.units.filter(u => !credited.has(u.key)).reduce((a, u) => a + u.mins, 0);
      ss.units.forEach(u => credited.add(u.key));
      ss.mins = Math.max(ss.span, ss.floor);
      total += ss.mins;
    });
    const aliases = [...new Set(rs.map(r => r.name))].filter(n => n !== person);
    return {person, aliases, done52, doneAi, eps52, epsAi, usb, sessions, total, last: sorted[sorted.length - 1].submitted_at};
  }).sort((a, b) => a.person.localeCompare(b.person, "zh-Hant"));
}
// ==== 開放管理：主辦人手動開啟／關閉入口網站上的集數（覆蓋網頁上的排程預設）====
let openState = {}, openDefaults = {}, openLoaded = false;
async function loadOpenState(){
  try{
    const res = await fetch(API_BASE + "/open-state");
    openState = (await res.json()).state || {};
  } catch(e){ openState = {}; }
  // 網頁上的預設：直接讀主題頁，看哪些卡片原本就是可點的（排程開放後會變）
  for(const t of ["value", "ai"]){
    try{
      const html = await (await fetch(`../${t}/index.html`, {cache: "no-store"})).text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      doc.querySelectorAll(".lesson[data-ep]").forEach(c => {
        openDefaults[c.getAttribute("data-ep")] = c.tagName === "A" && !c.classList.contains("upcoming");
      });
    } catch(e){}
  }
  openLoaded = true;
  render();
}
const isOpenNow = (k) => k in openState ? openState[k] === true : !!openDefaults[k];
function openChip(k){
  const manual = k in openState;
  return isOpenNow(k) ? `<span class="chip open${manual ? " manual" : ""}">✅ 開放中</span>`
                      : `<span class="chip closed${manual ? " manual" : ""}">🔒 未開放</span>`;
}
function openSeg(k){
  const mode = k in openState ? (openState[k] ? "open" : "closed") : "auto";
  const btn = (m, label) => `<button type="button" class="${mode === m ? "on" : ""}" onclick="event.preventDefault(); event.stopPropagation(); setOpenState('${k}', ${m === "auto" ? "null" : m === "open"})">${label}</button>`;
  return `<span class="seg" onclick="event.preventDefault(); event.stopPropagation()" title="依排程＝照網頁上原本的開放日期；開放／關閉會蓋過排程">${btn("auto", "依排程")}${btn("open", "開放")}${btn("closed", "關閉")}</span>`;
}
async function setOpenState(ep, open){
  $("status").textContent = "儲存中…";
  try{
    const res = await fetch(API_BASE + "/admin/open-state", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Key": adminKey() },
      body: JSON.stringify({ ep, open })
    });
    if(res.status === 404) throw new Error("雲端 Worker 還是舊版，請先部署新版 worker.js");
    if(!res.ok) throw new Error("HTTP " + res.status);
    openState = (await res.json()).state || {};
    render();
    $("status").textContent = "已儲存 ✓ 學員重新整理入口網站就會看到";
  } catch(e){
    $("status").textContent = "儲存失敗：" + e.message;
  }
}

function historyHtml(rows){
  if(!adminMode){ historyData = []; return `<div class="ep empty">學習歷程要用管理密碼登入才看得到</div>`; }
  historyData = buildHistory(rows);
  if(!historyData.length) return `<div class="ep empty">還沒有具名的學習紀錄</div>`;
  const totalAll = historyData.reduce((a, x) => a + x.total, 0);
  return `<section class="ep nameList"><div class="epHead"><span class="epTag">學習歷程</span>`
    + `<span class="epTitle">學員學習歷程：${historyData.length} 人・合計 ${fmtMins(totalAll)}</span>`
    + `<button type="button" id="historyCsv">下載學習歷程 CSV</button></div>`
    + `<p class="hint">線上學習時數＝每段作答（間隔超過 ${SESSION_GAP_MIN} 分鐘算新的一段）取「實際時間差」與「內容用 1.5 倍速播完的長度」較大者。同名、同社編、少打姓視為同一人。點名字看明細。</p>`
    + `<table class="names hist"><tr><th>名字＋社編</th><th>工程師的價值</th><th>AI 素養</th><th>USB 資安</th><th>線上學習時數</th><th>最近學習</th></tr>`
    + historyData.map((x, k) => `<tr><td><details><summary>${esc(x.person)}</summary>`
        + (x.aliases.length ? `<small>也寫成：${x.aliases.map(esc).join("、")}</small>` : "")
        + `<ul class="sess">` + x.sessions.map(ss => `<li><b>${esc(new Date(ss.start).toLocaleString("zh-TW"))}</b>　採計 ${fmtMins(ss.mins)}`
          + `<small>（實際 ${fmtMins(ss.span)}／1.5 倍速內容 ${fmtMins(ss.floor)}）</small><br>`
          + ss.units.map(u => esc(u.title)).join("、") + `</li>`).join("") + `</ul></details></td>`
      + `<td>${x.done52.length} / ${x.eps52.length} 集</td>`
      + `<td>${x.doneAi.length} / ${x.epsAi.length} 堂</td>`

      + `<td><b>${fmtMins(x.total)}</b></td>`

}
function downloadHistoryCsv(){
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [["名字＋社編", "其他寫法", "工程師的價值完成集數", "完成的集數", "AI 素養完成堂數", "完成的堂數",
    "USB 完成單元", "USB 結訓測驗", "USB 結訓", "線上學習時數（分）", "線上學習時數（小時）", "學習段數", "最近學習"].map(cell).join(",")]
    .concat(historyData.map(x => [x.person, x.aliases.join("、"),
      `${x.done52.length}/${x.eps52.length}`, x.done52.map(e => e.tag).join("、"),
      `${x.doneAi.length}/${x.epsAi.length}`, x.doneAi.map(e => e.tag).join("、"),
      x.usb ? `${x.usb.done}/${x.usb.total}` : "", x.usb && x.usb.exam ? x.usb.exam.choice : "", x.usb ? (x.usb.pass ? "通過" : "未通過") : "",
      Math.round(x.total), (x.total / 60).toFixed(2), x.sessions.length, timeStr(x.last)].map(cell).join(",")));
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `學習歷程_${new Date().toISOString().slice(0, 10)}.csv`;

  URL.revokeObjectURL(a.href);

function latestByName(rs){
  const seen = new Set();
  return rs.filter(r => r.name && !seen.has(r.name) && seen.add(r.name));
}

function sinceTime(){
  const v = $("since").value;
  return v ? new Date(v + "T00:00:00").getTime() : 0;
}
function filteredRows(){
  const t = sinceTime();
  return allRows.filter(r => !t || new Date(r.submitted_at).getTime() >= t);
}

function barsHtml(items){
  // items: [{label, n}]；單一數列，數字直接標在旁邊，不需要圖例
  const total = items.reduce((a, b) => a + b.n, 0);
  const max = Math.max(0, ...items.map(x => x.n));
  return items.map(x => {
    const pct = total ? Math.round(x.n / total * 100) : 0;
    const top = max > 0 && x.n === max ? " top" : "";
    return `<div class="row${top}" title="${esc(x.label)}：${x.n} 人（${pct}%）"><span class="lab">${esc(x.label)}</span>`
      + `<span class="num">${x.n} 人・${pct}%</span>`
      + `<div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
  }).join("");
}

  {id: "ai", series: "ai", name: "AI 素養 × 工程師", unit: "堂"},

];
function route(){

const qKey = (sc, k) => sc.q || `情境${k+1}`;
const lastTime = (rs) => rs.reduce((a, r) => (r.submitted_at > a ? r.submitted_at : a), "");
// 作答人數：情境卡取各卡作答數的最大值；沒有情境卡的集數＝回應筆數
function peopleOf(scenarios, rs){
  return scenarios.length ? Math.max(0, ...scenarios.map((sc, k) => rs.filter(r => r.question === qKey(sc, k)).length))
                          : rs.filter(r => !isScn(r) && r.question !== EXAM_Q).length;
}
function tile(k, v){ return `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`; }

function scenarioBlock(scenarios, rs){
  const scnRows = rs.filter(isScn);
  if(!scenarios.length) return "";
  if(!scnRows.length) return `<div class="empty">情境卡還沒有人作答</div>`;
  return `<div class="block"><div class="blockTitle">情境卡</div>` + scenarios.map((sc, k) => {
    const qr = scnRows.filter(r => r.question === qKey(sc, k));
    const named = latestByName(qr);
    return `<div class="q">${sc.q ? "" : `情境 ${k+1}｜`}${esc(sc.situation)}</div>`
      + barsHtml(sc.options.map((t, j) => ({label: `${LETTERS[j]}. ${t}`, n: qr.filter(r => r.choice === LETTERS[j]).length})))
      + (named.length ? `<details class="nameList"><summary>具名作答 ${named.length} 人</summary><table class="names"><tr><th>名字＋社編</th><th>選擇</th><th>時間</th></tr>`
          + named.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.choice)}. ${esc(sc.options[LETTERS.indexOf(r.choice)] || "")}</td><td>${esc(timeStr(r.submitted_at))}</td></tr>`).join("")
          + `</table></details>` : "");
  }).join("") + `</div>`;
}
function feedbackBlock(ep, rs){
  const otherRows = rs.filter(r => !isScn(r) && r.question !== EXAM_Q);
  let body = "";
  const choiceRows = otherRows.filter(r => r.choice);
  if(ep.takeaways.length && choiceRows.length){
    body += `<div class="block"><div class="blockTitle">最有感的一點（${choiceRows.length} 人選）</div>`
      + barsHtml(ep.takeaways.map(t => ({label: t, n: choiceRows.filter(r => r.choice === t).length}))) + `</div>`;
  }
  const texts = otherRows.filter(r => r.response);
  if(texts.length){
    body += `<details open><summary>打字回應 ${texts.length} 則</summary><ul class="texts">`
      + texts.map(r => `<li><time>${esc(timeStr(r.submitted_at))}${r.name ? `<span class="nameList">・${esc(r.name)}</span>` : ""}</time>${esc(r.response)}</li>`).join("")
      + `</ul></details>`;
  }
  return body;
}

// USB 結訓名單：每個單元的情境題都做完＋測驗及格才算通過；同一人的重複紀錄合併
function rosterInfo(course, rs){
  const chapQs = {};
  course.scenarios.forEach(sc => { const m = (sc.q || "").match(/^第(\d+)章/); if(m) (chapQs[m[1]] = chapQs[m[1]] || []).push(sc.q); });
  const chapNums = Object.keys(chapQs).sort((a, b) => a - b);
  const namedAll = rs.filter(r => r.name);
  const roster = [...new Set(namedAll.map(r => r.name))].sort((a, b) => a.localeCompare(b, "zh-Hant")).map(name => {
    const mine = namedAll.filter(r => r.name === name);
    const done = chapNums.filter(n => chapQs[n].every(q => mine.some(r => r.question === q)));
    const miss = chapNums.filter(n => !done.includes(n));
    const exam = mine.find(r => r.question === EXAM_Q); // 資料是新到舊，第一筆就是最後一次交卷
    return {name, done, miss, exam, pass: !miss.length && !!exam && /・通過/.test(exam.choice || "")};
  });
  // 同一組裡有人通過 → 只留通過的；都沒通過 → 只留進度最多的一筆。被收起來的列在下面，不刪資料
  const score = (x) => [x.pass ? 1 : 0, x.done.length, x.exam ? 1 : 0, x.exam ? x.exam.submitted_at : ""];
  const better = (a, b) => { const sa = score(a), sb = score(b); for(let k = 0; k < sa.length; k++){ if(sa[k] !== sb[k]) return sa[k] > sb[k] ? a : b; } return a; };
  const parent = roster.map((x, k) => k);
  const root = (k) => parent[k] === k ? k : (parent[k] = root(parent[k]));
  roster.forEach((x, k) => roster.forEach((y, j) => { if(j > k && sameName(x.name, y.name)) parent[root(j)] = root(k); }));
  const groups = {};
  roster.forEach((x, k) => (groups[root(k)] = groups[root(k)] || []).push(x));
  const kept = [], merged = [];
  Object.values(groups).forEach(g => {
    const keep = g.some(x => x.pass) ? g.filter(x => x.pass) : [g.reduce(better)];
    g.forEach(x => (keep.includes(x) ? kept : merged).push(x));
  });
  const shown = roster.filter(x => kept.includes(x));
  return {chapNums, chapQs, shown, merged, nPass: shown.filter(x => x.pass).length};
}
function rosterHtml(info){
  if(!adminMode) return `<div class="ep empty">結訓名單要用管理密碼登入才看得到</div>`;
  if(!info.shown.length) return `<div class="ep empty">還沒有具名的作答</div>`;
  const n = info.chapNums.length;
  const rowHtml = (x) => `<tr><td>${esc(x.name)}</td>`
    + `<td>${x.done.length} / ${n}${x.miss.length ? `<br><small class="fail">缺第 ${x.miss.join("、")} 章</small>` : ""}</td>`
    + `<td>${x.exam ? `${esc(x.exam.choice)}<br><small>${esc(timeStr(x.exam.submitted_at))}</small>` : `<span class="fail">未交卷</span>`}</td>`
    + `<td class="${x.pass ? "pass" : "fail"}">${x.pass ? "✅ 通過" : "未通過"}</td></tr>`;
  const head = `<tr><th>名字＋社編</th><th>單元完成</th><th>結訓測驗（最後一次）</th><th>結訓</th></tr>`;
  return `<section class="ep nameList"><div class="blockTitle">結訓名單：通過 ${info.nPass} / ${info.shown.length} 人`
    + `（${n} 個單元的情境題都做完＋測驗及格才算通過${info.merged.length ? `；已合併重複 ${info.merged.length} 筆` : ""}）</div>`
    + `<table class="names">${head}${info.shown.map(rowHtml).join("")}</table>`
    + (info.merged.length ? `<details><summary>被合併的重複紀錄 ${info.merged.length} 筆（同名、同社編或少打姓，視為同一人：已有完成的就只留完成的，否則留進度最多的一筆；若其實是不同人請自行判斷）</summary>`
        + `<table class="names">${head}${info.merged.map(rowHtml).join("")}</table></details>` : "")
    + `</section>`;
}

    + `<div class="units">` + eps.map(e => {

// USB：10 章＋結訓測驗＋結訓名單
function usbView(tab, byLabel, unit){
  const course = EPISODES.find(e => e.series === "usb");
  if(!course) return `<div class="ep empty">沒有 USB 課程資料</div>`;
  const rs = byLabel[course.label] || [];
  const info = rosterInfo(course, rs);
  const examRows = rs.filter(r => r.question === EXAM_Q);
  const passedExam = examRows.filter(r => /・通過/.test(r.choice || "")).length;
  const chScn = (n) => course.scenarios.filter(sc => (sc.q || "").startsWith(`第${n}章`));
  const chRows = (n) => rs.filter(r => (r.question || "").startsWith(`第${n}章`));
  const back = `<a class="back" href="#usb">← 回 USB 資安宣導單元列表</a>`;
  if(unit === "roster") return back + rosterHtml(info);
  if(unit === "exam"){
    const named = latestByName(examRows);
    return back + `<section class="ep"><div class="detailHead"><span class="epTag">USB</span><span class="epTitle">📝 結訓測驗</span></div>`
      + `<div class="tiles" style="margin-top:12px">${tile("交卷次數", examRows.length)}${tile("測驗及格", passedExam)}${tile("測驗不及格", examRows.length - passedExam)}</div>`
      + (examRows.length ? barsHtml([{label: "測驗及格（80 分以上且必答題對）", n: passedExam}, {label: "測驗不及格", n: examRows.length - passedExam}]) : `<div class="empty">還沒有人交卷</div>`)
      + (named.length ? `<div class="nameList"><div class="sectionTitle">每人最後一次成績（${named.length} 人）</div><table class="names"><tr><th>名字＋社編</th><th>成績</th><th>各題作答</th><th>時間</th></tr>`
          + named.map(r => `<tr><td>${esc(r.name)}</td><td class="${/・通過/.test(r.choice) ? "pass" : "fail"}">${esc(r.choice)}</td><td><small>${esc(r.response)}</small></td><td>${esc(timeStr(r.submitted_at))}</td></tr>`).join("")
          + `</table></div>` : "")
      + `</section>`;
  }
  const m = unit.match(/^ch(\d+)$/);
  if(m){
    const n = +m[1], rows = chRows(n);
    return back + `<section class="ep"><div class="detailHead"><span class="epTag">第 ${n} 章</span><span class="epTitle">${esc(course.chapters[n - 1] || "")}</span></div>`
      + `<div class="tiles" style="margin-top:12px">${tile("作答人數", peopleOf(chScn(n), rows))}${tile("回應筆數", rows.length)}`
      + tile("最近一筆", `<span style="font-size:15px">${lastTime(rows) ? esc(timeStr(lastTime(rows))) : "—"}</span>`) + `</div>`
      + scenarioBlock(chScn(n), rows) + `</section>`;
  }
  const unitRow = (href, tag, title, sub, chip) => `<a class="unit" href="#usb/${href}"><span class="epTag">${tag}</span>`
    + `<span class="ut"><b>${title}</b><small>${sub}</small></span>${chip || "<span></span>"}<span></span><span class="more">查看 ▸</span></a>`;
  return `<div class="tiles">`
    + (adminMode ? tile("結訓通過", `${info.nPass}<small> / ${info.shown.length} 人</small>`) : "")
    + tile("測驗交卷", `${examRows.length}<small> 次</small>`)
    + tile("回應筆數", rs.length)
    + tile("最近一筆", `<span style="font-size:15px">${lastTime(rs) ? esc(timeStr(lastTime(rs))) : "—"}</span>`) + `</div>`
    + `<div class="units">`
    + unitRow("roster", "🎓", "結訓名單", adminMode ? `通過 ${info.nPass} / ${info.shown.length} 人・逐人看單元完成與測驗成績` : "要管理密碼才看得到",
        adminMode ? `<span class="chip open">${info.nPass} 人通過</span>` : "")
    + course.chapters.map((t, k) => {
        const rows = chRows(k + 1);
        return unitRow(`ch${k + 1}`, `第 ${k + 1} 章`, esc(t), rows.length ? `${peopleOf(chScn(k + 1), rows)} 人作答・${rows.length} 筆` : "還沒有回應");
      }).join("")
    + unitRow("exam", "📝", "結訓測驗", examRows.length ? `交卷 ${examRows.length} 次・及格 ${passedExam} 次` : "還沒有人交卷")
    + `</div>`;
}

function render(){
  const rows = filteredRows();
  const byLabel = {};
  rows.forEach(r => { (byLabel[r.episode] = byLabel[r.episode] || []).push(r); });
  const {tab: tabId, unit} = route();
  const tab = TABS.find(t => t.id === tabId);
  const known = new Set(EPISODES.map(e => e.label));
  $("tabs").innerHTML = TABS.map(t => {
    let sub;
    if(t.series){
      const eps = EPISODES.filter(e => e.series === t.series);
      const n = eps.reduce((a, e) => a + (byLabel[e.label] || []).length, 0);
      sub = t.series === "usb" ? `10 章＋結訓・${n} 筆回應` : `${eps.length} ${t.unit}・${n} 筆回應`;
    } else sub = adminMode ? "完成單元＋線上學習時數" : "要管理密碼";
    return `<a class="tab${t.id === tabId ? " cur" : ""}" href="#${t.id}"><b>${t.name}</b><small>${sub}</small></a>`;
  }).join("");
  let html;
  if(tab.id === "people"){
    html = historyHtml(rows);
    const orphan = rows.filter(r => !known.has(r.episode));
    if(orphan.length){
      html += `<section class="ep"><div class="epHead"><span class="epTag">其他</span><span class="epTitle">對不上目前集數的回應</span>`
        + `<span class="epCount">${orphan.length} 筆</span></div><details><summary>展開</summary><ul class="texts">`
        + orphan.map(r => `<li><time>${esc(r.episode)}・${esc(timeStr(r.submitted_at))}</time>`
          + `${esc([r.question, r.choice, r.response].filter(Boolean).join("｜"))}</li>`).join("")
        + `</ul></details></section>`;
    }
  } else if(tab.id === "usb"){
    html = usbView(tab, byLabel, unit);
  } else {
    html = seriesView(tab, EPISODES.filter(e => e.series === tab.series), byLabel, unit);
  }
  $("view").innerHTML = html;
  const hc = $("historyCsv");
  if(hc) hc.onclick = downloadHistoryCsv;
}

async function load(){
  if(!API_BASE){
    showMain();
    $("status").textContent = "這是本機版，沒有連到雲端，看不到資料。請從網站首頁的「🔒 後台管理」進入。";
    render();
    return;
  }
  if(!adminKey()){ showGate(""); return; }
  if(!$("main").hidden) $("status").textContent = "載入中…";
  let note = "";
  try{
    adminMode = false;
    const res = await fetch(API_BASE + "/admin/responses", { headers: { "X-Admin-Key": adminKey() } });
    if(res.status === 401){ setAdminKey(""); showGate("密碼不對，請再試一次"); return; }
    if(res.ok){
      allRows = (await res.json()).responses || [];
      adminMode = true;
      if(!openLoaded) loadOpenState();
    } else {
      // 管理密碼對了但讀名單失敗（例如資料庫還沒加 name 欄）：先顯示不含名字的資料
      note = res.status === 503 ? "雲端資料庫還沒加 name 欄（migrations/002_add_name.sql），先顯示不含名字的資料。"
        : "名單讀取失敗（HTTP " + res.status + "），先顯示不含名字的資料。";
      const pub = await fetch(API_BASE + "/responses", { headers: { "X-Site-Key": SITE_KEY } });
      if(!pub.ok) throw new Error("HTTP " + pub.status);
      allRows = (await pub.json()).responses || [];
    }
    showMain();
    $("status").textContent = note || ("更新時間 " + new Date().toLocaleTimeString("zh-TW"));
  } catch(e){
    if($("main").hidden){ showGate("連不上雲端，晚點再試試看"); return; }
    $("status").textContent = "連不上雲端，晚點再試試看";
  }
  renderAdminBox();
  render();
}

function renderAdminBox(){
  const hidden = document.body.classList.contains("hideNames");
  $("adminBox").innerHTML = `<span class="adminOn">🔓 已登入</span> `
    + `<label><input type="checkbox" id="hideNames"${hidden ? " checked" : ""}> 隱藏名字（投影用）</label> `
    + `<button type="button" id="adminOut">登出</button>`;
  $("hideNames").onchange = (e) => document.body.classList.toggle("hideNames", e.target.checked);
  $("adminOut").onclick = () => { setAdminKey(""); allRows = []; adminMode = false; showGate("已登出"); };
}

function downloadCsv(){
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const titleOf = Object.fromEntries(EPISODES.map(e => [e.label, `${e.tag} ${e.title}`]));
  // 解鎖名單時才多一欄「名字＋社編」
  const head = ["集數", "題目", "選擇", "打字回應"].concat(adminMode ? ["名字＋社編"] : [], ["時間"]);
  const lines = [head.map(cell).join(",")]
    .concat(filteredRows().map(r => [titleOf[r.episode] || r.episode, r.question, r.choice, r.response]
      .concat(adminMode ? [r.name] : [], [timeStr(r.submitted_at)]).map(cell).join(",")));
  const blob = new Blob(["﻿" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `回應結果_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

$("since").addEventListener("change", render);
$("reload").onclick = load;
$("csv").onclick = downloadCsv;
$("gate").addEventListener("submit", () => {
  const v = $("gateKey").value.trim();
  if(!v){ $("gateMsg").textContent = "請輸入管理密碼"; return; }
  $("gateGo").disabled = true; $("gateGo").textContent = "登入中…";
  setAdminKey(v); load();
});
load();
setInterval(() => { if($("gate").hidden) load(); }, 60000); // 開著放在投影幕上時，每分鐘自動更新
</script>
</body>
