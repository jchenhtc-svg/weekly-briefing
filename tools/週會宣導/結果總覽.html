<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>回應結果總覽</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#15181e; --sub:#5d6573; --muted:#8a93a2; --line:#dfe3ea;
    --bar:#3b6fd8; --track:#eef1f6; --top:#1f4fb8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#171a21; --ink:#eef1f6; --sub:#a9b1bf; --muted:#7c8594; --line:#2a2f3a;
      --bar:#6f9cf0; --track:#232833; --top:#9dbcf7; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.55}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:13px;margin:0 0 18px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .controls label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
  select,input[type=date],button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  button{cursor:pointer;font-weight:700}
  button:hover{border-color:var(--bar)}
  .status{font-size:12px;color:var(--muted);margin-left:auto}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .tile .k{font-size:12px;color:var(--sub)}
  .tile .v{font-size:26px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
  .tile .v small{font-size:13px;color:var(--sub);font-weight:600}
  .ep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .epHead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
  .epTag{font-size:11.5px;font-weight:800;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .epTitle{font-size:16px;font-weight:800}
  .epCount{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);font-size:13px;margin-top:6px}
  .block{margin-top:12px}
  .blockTitle{font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:6px}
  .q{font-size:13px;font-weight:700;margin:8px 0 6px}
  .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;margin-bottom:7px;font-size:13px}
  .row .lab{overflow-wrap:anywhere}
  .row .num{font-size:12.5px;color:var(--sub);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .track{grid-column:1 / -1;height:8px;background:var(--track);border-radius:999px;overflow:hidden}
  .fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0}
  .row.top .lab{font-weight:800}
  details{margin-top:10px}
  summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--sub)}
  .texts{margin:8px 0 0;padding:0;list-style:none}
  .texts li{font-size:13.5px;padding:8px 10px;border-left:3px solid var(--line);margin-bottom:6px;background:var(--track);border-radius:0 8px 8px 0}
  .texts time{display:block;font-size:11.5px;color:var(--muted)}
  .note{font-size:12px;color:var(--muted);margin-top:24px}
  input[type=password]{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:9em}
  .adminOn{font-size:12px;font-weight:800;color:#15803d}
  table.names{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  table.names th,table.names td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  table.names th{font-size:12px;color:var(--sub)}
  .pass{color:#15803d;font-weight:800}
  .gate{max-width:360px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center}
  .gate h1{margin-bottom:6px}
  .gate p{color:var(--sub);font-size:13.5px;margin:0 0 16px}
  .gate input[type=password]{width:100%;font-size:16px;padding:10px 12px;margin-bottom:10px}
  .gate button{width:100%;font-size:15px;padding:10px;background:var(--ink);color:var(--card);border-color:var(--ink)}
  .gateMsg{color:#b91c1c;font-size:13px;font-weight:700;min-height:1.4em;margin-top:8px}
  .gate .back{display:inline-block;margin-top:12px;font-size:13px;color:var(--sub)}
  body.hideNames .nameList{display:none}
  .fail{color:#b91c1c;font-weight:800}
  @media (max-width:480px){ .status{margin-left:0;width:100%} .epCount{margin-left:0;width:100%} }
</style>
</head>
<body>
<!-- 後台管理：從首頁「🔒 後台管理」進來，先輸入管理密碼（Worker 的 ADMIN_KEY）才看得到資料 -->
<form class="gate" id="gate" hidden onsubmit="return false">
  <h1>🔒 後台管理</h1>
  <p>回應結果總覽（含具名名單），請輸入管理密碼</p>
  <input type="password" id="gateKey" autocomplete="current-password" placeholder="管理密碼">
  <button type="submit" id="gateGo">登入</button>
  <div class="gateMsg" id="gateMsg"></div>
  <a class="back" href="../index.html">← 回首頁</a>
</form>

<div class="wrap" id="main" hidden>
  <h1>回應結果總覽</h1>
  <p class="sub">《工程師的價值》52 週系列、《AI 素養 × 工程師》月例會、USB 資安宣導的所有回應。入口在首頁最下方「🔒 後台管理」，要管理密碼才進得來。</p>

  <div class="controls">
    <label>系列
      <select id="series">
        <option value="all">全部</option>
        <option value="52">工程師的價值（52 週）</option>
        <option value="ai">AI 素養 × 工程師</option>
        <option value="usb">USB 資安宣導</option>
      </select>
    </label>
    <label>從這天起算 <input type="date" id="since"></label>
    <label><input type="checkbox" id="hideEmpty" checked> 隱藏沒有回應的集數</label>
    <button type="button" id="reload">重新整理</button>
    <button type="button" id="csv">下載 CSV</button>
    <span id="adminBox"></span>
    <span class="status" id="status">載入中…</span>
  </div>

  <div class="tiles" id="tiles"></div>
  <div id="list"></div>

  <p class="note">「從這天起算」可以排除開放前的測試作答。情境卡同一支手機每張只算一次；「最有感的一點」和打字回應每送出一次算一筆。CSV 用 Excel 開啟即可（UTF-8）。<br>
    具名作答（USB 第 7 章必答題、結訓測驗）的名字只在這個後台看得到；要投影統計給大家看時，勾「隱藏名字（投影用）」。登入只記在這個分頁，關掉分頁或按「登出」就要重新輸入密碼。</p>
</div>

<script>
// 由 產生網頁.py --cloud 填入；本機版留空，這一頁只在雲端版有資料
const API_BASE = "";
const SITE_KEY = "";
// 每一集的標籤、標題、選項文字（產生網頁.py 從腳本整理），用來把資料庫裡的 A/B/C 對回選項
const EPISODES = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LETTERS = "ABCDE";
let allRows = [];
let adminMode = false; // 用管理密碼讀到含名字的資料
const EXAM_Q = "結訓測驗";
const isScn = (r) => /^(第\d+章)?情境\d+$/.test(r.question || "");
const adminKey = () => { try { return sessionStorage.getItem("admin-key") || ""; } catch(e){ return ""; } };
function setAdminKey(v){ try { v ? sessionStorage.setItem("admin-key", v) : sessionStorage.removeItem("admin-key"); } catch(e){} }
const timeStr = (t) => new Date(t).toLocaleString("zh-TW");
// 每個名字只留最後一次（資料已經是新到舊）
function latestByName(rs){
  const seen = new Set();
  return rs.filter(r => r.name && !seen.has(r.name) && seen.add(r.name));
}

function sinceTime(){
  const v = $("since").value;
  return v ? new Date(v + "T00:00:00").getTime() : 0;
}
function filteredRows(){
  const t = sinceTime();
  return allRows.filter(r => !t || new Date(r.submitted_at).getTime() >= t);
}

function barsHtml(items){
  // items: [{label, n}]；單一數列，數字直接標在旁邊，不需要圖例
  const total = items.reduce((a, b) => a + b.n, 0);
  const max = Math.max(0, ...items.map(x => x.n));
  return items.map(x => {
    const pct = total ? Math.round(x.n / total * 100) : 0;
    const top = max > 0 && x.n === max ? " top" : "";
    return `<div class="row${top}" title="${esc(x.label)}：${x.n} 人（${pct}%）"><span class="lab">${esc(x.label)}</span>`
      + `<span class="num">${x.n} 人・${pct}%</span>`
      + `<div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
  }).join("");
}

function render(){
  const rows = filteredRows();
  const series = $("series").value;
  const eps = EPISODES.filter(e => series === "all" || e.series === series);
  const byLabel = {};
  rows.forEach(r => { (byLabel[r.episode] = byLabel[r.episode] || []).push(r); });

  let html = "", shownRows = 0, epsWithData = 0;
  eps.forEach(ep => {
    const rs = byLabel[ep.label] || [];
    if(!rs.length && $("hideEmpty").checked) return;
    if(rs.length) epsWithData++;
    shownRows += rs.length;
    const scnRows = rs.filter(isScn);
    const examRows = rs.filter(r => r.question === EXAM_Q);
    const otherRows = rs.filter(r => !isScn(r) && r.question !== EXAM_Q);
    const people = examRows.length && !scnRows.length ? examRows.length : ep.scenarios.length
      ? Math.max(0, ...ep.scenarios.map((sc, k) => scnRows.filter(r => r.question === (sc.q || `情境${k+1}`)).length))
      : otherRows.length;
    let body = "";
    if(!rs.length) body = `<div class="empty">還沒有回應</div>`;
    if(ep.scenarios.length && scnRows.length){
      body += `<div class="block"><div class="blockTitle">情境卡</div>` + ep.scenarios.map((sc, k) => {
        const qr = scnRows.filter(r => r.question === (sc.q || `情境${k+1}`));
        const named = latestByName(qr);
        return `<div class="q">${sc.q ? "" : `情境 ${k+1}｜`}${esc(sc.situation)}</div>`
          + barsHtml(sc.options.map((t, j) => ({label: `${LETTERS[j]}. ${t}`, n: qr.filter(r => r.choice === LETTERS[j]).length})))
          + (named.length ? `<details class="nameList"><summary>具名作答 ${named.length} 人</summary><table class="names"><tr><th>名字＋社編</th><th>選擇</th><th>時間</th></tr>`
              + named.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.choice)}. ${esc(sc.options[LETTERS.indexOf(r.choice)] || "")}</td><td>${esc(timeStr(r.submitted_at))}</td></tr>`).join("")
              + `</table></details>`
            : (sc.require_name && qr.length && !adminMode ? `<div class="empty">具名名單：輸入管理密碼後才看得到</div>` : ""));
      }).join("") + `</div>`;
    }
    // 課程（USB）：各章的情境題代號，用來逐人核對「每個單元都做完」
    const chapQs = {};
    ep.scenarios.forEach(sc => { const m = (sc.q || "").match(/^第(\d+)章/); if(m) (chapQs[m[1]] = chapQs[m[1]] || []).push(sc.q); });
    const chapNums = Object.keys(chapQs).sort((a, b) => a - b);
    if(examRows.length){
      // choice 是「88分・通過」或「72分・未通過・必答題答錯」
      const passed = examRows.filter(r => /・通過/.test(r.choice || "")).length;
      body += `<div class="block"><div class="blockTitle">結訓測驗：交卷 ${examRows.length} 次・測驗及格 ${passed} 次</div>`
        + barsHtml([{label: "測驗及格", n: passed}, {label: "測驗不及格", n: examRows.length - passed}]) + `</div>`;
    }
    const namedAll = rs.filter(r => r.name);
    if(chapNums.length && namedAll.length){
      // 結訓名單：每個單元的情境題都做完＋測驗 80 分以上且必答題對，才算通過
      const people = [...new Set(namedAll.map(r => r.name))].sort((a, b) => a.localeCompare(b, "zh-Hant"));
      const roster = people.map(name => {
        const mine = namedAll.filter(r => r.name === name);
        const done = chapNums.filter(n => chapQs[n].every(q => mine.some(r => r.question === q)));
        const miss = chapNums.filter(n => !done.includes(n));
        const exam = mine.find(r => r.question === EXAM_Q); // 資料是新到舊，第一筆就是最後一次交卷
        const pass = !miss.length && exam && /・通過/.test(exam.choice || "");
        return {name, done, miss, exam, pass};
      });
      // 同名合併：社編打錯或換手機重填，同一個名字會出現好幾筆。
      // 同名裡有人通過 → 只留通過的；都沒通過 → 只留進度最多的一筆。被收起來的列在下面，不刪資料
      const nameOf = (x) => x.name.replace(/\d+$/, "");
      const score = (x) => [x.pass ? 1 : 0, x.done.length, x.exam ? 1 : 0, x.exam ? x.exam.submitted_at : ""];
      const better = (a, b) => { const sa = score(a), sb = score(b); for(let k = 0; k < sa.length; k++){ if(sa[k] !== sb[k]) return sa[k] > sb[k] ? a : b; } return a; };
      const groups = {};
      roster.forEach(x => (groups[nameOf(x)] = groups[nameOf(x)] || []).push(x));
      const kept = [], merged = [];
      Object.values(groups).forEach(g => {
        const keep = g.some(x => x.pass) ? g.filter(x => x.pass) : [g.reduce(better)];
        g.forEach(x => (keep.includes(x) ? kept : merged).push(x));
      });
      const shown = roster.filter(x => kept.includes(x)); // 維持原本的排序
      const nPass = shown.filter(x => x.pass).length;
      const rowHtml = (x) => `<tr><td>${esc(x.name)}</td>`
          + `<td>${x.done.length} / ${chapNums.length}${x.miss.length ? `<br><small class="fail">缺第 ${x.miss.join("、")} 章</small>` : ""}</td>`
          + `<td>${x.exam ? `${esc(x.exam.choice)}<br><small>${esc(timeStr(x.exam.submitted_at))}</small>` : `<span class="fail">未交卷</span>`}</td>`
          + `<td class="${x.pass ? "pass" : "fail"}">${x.pass ? "✅ 通過" : "未通過"}</td></tr>`;
      const head = `<tr><th>名字＋社編</th><th>單元完成</th><th>結訓測驗（最後一次）</th><th>結訓</th></tr>`;
      body += `<div class="block nameList"><div class="blockTitle">結訓名單：通過 ${nPass} / ${shown.length} 人`
        + `（${chapNums.length} 個單元的情境題都做完＋測驗及格才算通過${merged.length ? `；已合併同名重複 ${merged.length} 筆` : ""}）</div>`
        + `<table class="names">${head}${shown.map(rowHtml).join("")}</table>`
        + (merged.length ? `<details><summary>被合併的同名紀錄 ${merged.length} 筆（同名裡已有人完成，或只留進度最多的一筆；若其實是不同人請自行判斷）</summary>`
            + `<table class="names">${head}${merged.map(rowHtml).join("")}</table></details>` : "")
        + `</div>`;
    } else if(chapNums.length && rs.length && !adminMode){
      body += `<div class="empty">結訓名單：要管理密碼才看得到</div>`;
    }
    const choiceRows = otherRows.filter(r => r.choice);
    if(ep.takeaways.length && choiceRows.length){
      body += `<div class="block"><div class="blockTitle">最有感的一點（${choiceRows.length} 人選）</div>`
        + barsHtml(ep.takeaways.map(t => ({label: t, n: choiceRows.filter(r => r.choice === t).length}))) + `</div>`;
    }
    const texts = otherRows.filter(r => r.response);
    if(texts.length){
      body += `<details><summary>打字回應 ${texts.length} 則</summary><ul class="texts">`
        + texts.map(r => `<li><time>${esc(new Date(r.submitted_at).toLocaleString("zh-TW"))}</time>${esc(r.response)}</li>`).join("")
        + `</ul></details>`;
    }
    html += `<section class="ep"><div class="epHead"><span class="epTag">${esc(ep.tag)}</span>`
      + `<span class="epTitle">${esc(ep.title)}</span><span class="epCount">${people} 人作答・${rs.length} 筆</span></div>${body}</section>`;
  });

  // 資料庫裡有、但對不上目前任何一集的（例如改過標題的舊集數）
  const known = new Set(EPISODES.map(e => e.label));
  const orphan = rows.filter(r => !known.has(r.episode));
  if(orphan.length && series === "all"){
    html += `<section class="ep"><div class="epHead"><span class="epTag">其他</span><span class="epTitle">對不上目前集數的回應</span>`
      + `<span class="epCount">${orphan.length} 筆</span></div><details><summary>展開</summary><ul class="texts">`
      + orphan.map(r => `<li><time>${esc(r.episode)}・${esc(new Date(r.submitted_at).toLocaleString("zh-TW"))}</time>`
        + `${esc([r.question, r.choice, r.response].filter(Boolean).join("｜"))}</li>`).join("")
      + `</ul></details></section>`;
  }

  $("list").innerHTML = html || `<div class="ep empty">這個條件下沒有資料</div>`;
  const last = rows.reduce((a, r) => (r.submitted_at > a ? r.submitted_at : a), "");
  $("tiles").innerHTML =
    `<div class="tile"><div class="k">回應筆數</div><div class="v">${shownRows}</div></div>`
    + `<div class="tile"><div class="k">有回應的集數</div><div class="v">${epsWithData}<small> / ${eps.length}</small></div></div>`
    + `<div class="tile"><div class="k">最近一筆</div><div class="v" style="font-size:16px">${last ? esc(new Date(last).toLocaleString("zh-TW")) : "—"}</div></div>`;
}

function showGate(msg){
  $("main").hidden = true; $("gate").hidden = false;
  $("gateMsg").textContent = msg || "";
  $("gateGo").disabled = false; $("gateGo").textContent = "登入";
  $("gateKey").value = ""; $("gateKey").focus();
}
function showMain(){ $("gate").hidden = true; $("main").hidden = false; }

async function load(){
  if(!API_BASE){
    showMain();
    $("status").textContent = "這是本機版，沒有連到雲端，看不到資料。請從網站首頁的「🔒 後台管理」進入。";
    render();
    return;
  }
  if(!adminKey()){ showGate(""); return; }
  if(!$("main").hidden) $("status").textContent = "載入中…";
  let note = "";
  try{
    adminMode = false;
    const res = await fetch(API_BASE + "/admin/responses", { headers: { "X-Admin-Key": adminKey() } });
    if(res.status === 401){ setAdminKey(""); showGate("密碼不對，請再試一次"); return; }
    if(res.ok){
      allRows = (await res.json()).responses || [];
      adminMode = true;
    } else {
      // 管理密碼對了但讀名單失敗（例如資料庫還沒加 name 欄）：先顯示不含名字的資料
      note = res.status === 503 ? "雲端資料庫還沒加 name 欄（migrations/002_add_name.sql），先顯示不含名字的資料。"
        : "名單讀取失敗（HTTP " + res.status + "），先顯示不含名字的資料。";
      const pub = await fetch(API_BASE + "/responses", { headers: { "X-Site-Key": SITE_KEY } });
      if(!pub.ok) throw new Error("HTTP " + pub.status);
      allRows = (await pub.json()).responses || [];
    }
    showMain();
    $("status").textContent = note || ("更新時間 " + new Date().toLocaleTimeString("zh-TW"));
  } catch(e){
    if($("main").hidden){ showGate("連不上雲端，晚點再試試看"); return; }
    $("status").textContent = "連不上雲端，晚點再試試看";
  }
  renderAdminBox();
  render();
}

function renderAdminBox(){
  const hidden = document.body.classList.contains("hideNames");
  $("adminBox").innerHTML = `<span class="adminOn">🔓 已登入</span> `
    + `<label><input type="checkbox" id="hideNames"${hidden ? " checked" : ""}> 隱藏名字（投影用）</label> `
    + `<button type="button" id="adminOut">登出</button>`;
  $("hideNames").onchange = (e) => document.body.classList.toggle("hideNames", e.target.checked);
  $("adminOut").onclick = () => { setAdminKey(""); allRows = []; adminMode = false; showGate("已登出"); };
}

function downloadCsv(){
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const titleOf = Object.fromEntries(EPISODES.map(e => [e.label, `${e.tag} ${e.title}`]));
  // 解鎖名單時才多一欄「名字＋社編」
  const head = ["集數", "題目", "選擇", "打字回應"].concat(adminMode ? ["名字＋社編"] : [], ["時間"]);
  const lines = [head.map(cell).join(",")]
    .concat(filteredRows().map(r => [titleOf[r.episode] || r.episode, r.question, r.choice, r.response]
      .concat(adminMode ? [r.name] : [], [timeStr(r.submitted_at)]).map(cell).join(",")));
  const blob = new Blob(["﻿" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `回應結果_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

["series", "since", "hideEmpty"].forEach(id => $(id).addEventListener("change", render));
$("reload").onclick = load;
$("csv").onclick = downloadCsv;
$("gate").addEventListener("submit", () => {
  const v = $("gateKey").value.trim();
  if(!v){ $("gateMsg").textContent = "請輸入管理密碼"; return; }
  $("gateGo").disabled = true; $("gateGo").textContent = "登入中…";
  setAdminKey(v); load();
});
load();
setInterval(() => { if($("gate").hidden) load(); }, 60000); // 開著放在投影幕上時，每分鐘自動更新
</script>
</body>
</html>
